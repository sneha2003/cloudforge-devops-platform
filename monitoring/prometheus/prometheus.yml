global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: workboard
    metrics_path: /metrics
    static_configs:
      - targets: [sample-service:8100]
        labels: { environment: local, service: workboard }
  - job_name: cloudforge-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
        labels: { environment: local, service: cloudforge-api }
  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

